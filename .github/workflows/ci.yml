# Sample CI for AI-Teaching-Assistant — copy to .github/workflows/ci.yml in THAT repo.
# Its purpose here is to make PRs produce real, required-able checks for the
# Gatekeeper app to analyze: a fast lint job (mechanical failures) and a test
# job (logical failures). Tune to the repo's actual layout.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run tests
        run: pytest -q
